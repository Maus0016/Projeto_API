<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Login | Secure Access</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="loading.css"> <!-- ADD THIS LINE -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Particles Background Container -->
    <div id="particles-js"></div>

    <div class="login-container">
        <div class="login-card">
            <div id="statusMessage" class="status-message"></div>
            
            <div class="login-header">
                <h1 class="login-title">QUANTUM LOGIN</h1>
                <p class="login-subtitle">Secure access to the neural network</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">
                        User ID / Email
                    </label>
                    <input type="text" id="username" class="form-input" placeholder="Enter your user ID or email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Password
                    </label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your passkey" required>
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" class="remember-checkbox" id="rememberMe">
                        <span>Remember this device</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot passkey?</a>
                </div>

                <button type="submit" class="login-btn" id="loginButton">
                    <i class="fas fa-sign-in-alt"></i>
                    ACCESS NEURAL NETWORK
                </button>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="social-login">
                    <button type="button" class="social-btn" id="googleLogin">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button type="button" class="social-btn" id="githubLogin">
                        <i class="fab fa-github"></i>
                        GitHub
                    </button>
                </div>

                <div class="register-link">
                    Not a quantum member yet?
                    <a href="#" id="registerLink">Request access</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Particles.js Library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="login.js"></script>
    <script src="loading.js"></script> <!-- ADD THIS LINE -->
    
    <!-- Initialize Particles -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        particlesJS('particles-js', {
            particles: {
                number: { value: 100, density: { enable: true, value_area: 1000 } },
                color: { value: "#6c5ce7" },
                shape: { type: "circle" },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#6c5ce7",
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" }
                }
            }
        });
    });
    </script>
</body>
</html>
