<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <!-- Back button with home page style -->
    <a href="../Home/" class="back-btn">
        <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
    </a>

    <!-- Create button with home page style -->
    <button id="criar">
        <i class="fas fa-plus"></i> Nova Mesa
    </button>

    <!-- Page title with home page gradient -->
    <h1><i class="fas fa-chair"></i> Mesas</h1>

    <!-- Dynamic mesas container -->
    <div class="container" id="mesas-container">
        <!-- Mesas will be loaded dynamically by JavaScript -->
        <div class="loading-message" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 15px; font-size: 1.2rem; opacity: 0.8;">Carregando mesas...</p>
        </div>
    </div>

    <!-- Notification badge (like home page) -->
    <div class="notification-badge" id="notification-badge" style="display: none;">
        <i class="fas fa-bell"></i>
        <span class="notification-count" id="notification-count">0</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script.js"></script>
</body>
</html>
