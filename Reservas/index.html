<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <!-- Back button with home page style -->
    <a href="../Home/" class="back-btn">
        <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
    </a>

    <!-- Page title with home page gradient -->
    <h1><i class="fas fa-calendar-check"></i> Reservas</h1>

    <!-- Create button with home page style -->
    <div class="create-bar" id="criarReserva">
        <i class="fas fa-plus"></i> Nova Reserva
    </div>

    <!-- Dynamic reservas container -->
    <div class="container" id="reservas-container">
        <!-- Reservas will be loaded dynamically by JavaScript -->
        <div class="loading-message" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 15px; font-size: 1.2rem; opacity: 0.8;">Carregando reservas...</p>
        </div>
    </div>

    <!-- Edit/Create Modal -->
    <div id="modalReserva" class="modal hidden">
        <div class="modal-content">
            <h2><i class="fas fa-calendar-plus"></i> Nova Reserva</h2>

            <label><i class="fas fa-user"></i> Cliente:</label>
            <input type="text" id="reservaCliente" placeholder="Nome do cliente">

            <label><i class="fas fa-phone"></i> Telefone:</label>
            <input type="tel" id="reservaTelefone" placeholder="(00) 00000-0000">

            <label><i class="fas fa-chair"></i> Número da Mesa:</label>
            <input type="number" id="reservaMesa" placeholder="Número da mesa" min="1">

            <label><i class="fas fa-calendar-day"></i> Data:</label>
            <input type="date" id="reservaData">

            <label><i class="fas fa-clock"></i> Hora:</label>
            <input type="time" id="reservaHora">

            <label><i class="fas fa-align-left"></i> Descrição:</label>
            <textarea id="reservaDescricao" placeholder="Observações ou detalhes da reserva" rows="3"></textarea>

            <div class="modal-buttons">
                <button id="salvarReserva">
                    <i class="fas fa-save"></i> Salvar Reserva
                </button>
                <button class="closeModal cancel">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </div>
    </div>

    <!-- Notification badge (like home page) -->
    <div class="notification-badge" id="notification-badge" style="display: none;">
        <i class="fas fa-bell"></i>
        <span class="notification-count" id="notification-count">0</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./script.js"></script>
</body>
</html>
